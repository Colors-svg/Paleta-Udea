<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 180" width="100%" height="100%">
  <defs>
    <style>
      .crest-stroke { stroke: #026937; stroke-width: 2.2; fill: none; stroke-linecap: round; stroke-linejoin: round; }
      .crest-fill { fill: #026937; }
      .text-title { font-family: "Times New Roman", Times, Georgia, serif; font-size: 26px; font-weight: bold; fill: #026937; letter-spacing: 0.5px; }
      .text-sub { font-family: "Times New Roman", Times, Georgia, serif; font-size: 15px; font-weight: bold; fill: #35944b; letter-spacing: 0.2px; }
      .text-year { font-family: "Times New Roman", Times, Georgia, serif; font-size: 8.5px; fill: #026937; letter-spacing: 2px; }
    </style>
  </defs>

  <!-- ESCUDO VECTORIAL INSTITUCIONAL UdeA -->
  <g transform="translate(15, 12)">
    <!-- Marco Ovalado Tradicional -->
    <ellipse cx="48" cy="62" rx="34" ry="48" class="crest-stroke" stroke-width="2.5" />
    <ellipse cx="48" cy="62" rx="30" ry="44" class="crest-stroke" stroke-width="1" stroke-dasharray="2 2" />

    <!-- Ancla Superior e Intermedia -->
    <path d="M 48,28 L 48,90 M 42,34 L 54,34 M 48,26 C 45,26 45,22 48,22 C 51,22 51,26 48,26 Z" class="crest-stroke" />
    <!-- Curvatura de brazos del ancla -->
    <path d="M 30,78 Q 48,96 66,78 M 30,78 L 26,76 M 66,78 L 70,76" class="crest-stroke" />
    
    <!-- Faja Central 'MEDELLÍN' -->
    <rect x="25" y="55" width="46" height="14" rx="2" fill="#ffffff" stroke="#026937" stroke-width="1.4" />
    <text x="48" y="65.5" font-family="'Times New Roman', serif" font-size="8" font-weight="bold" fill="#026937" text-anchor="middle" letter-spacing="1">MEDELLÍN</text>

    <!-- Blandones / Antorchas encendidas (Luz de la ciencia) -->
    <!-- Antorcha Izquierda -->
    <path d="M 28,42 L 28,52 M 25,42 L 31,42 M 28,40 Q 26,35 28,31 Q 30,35 28,40 Z" class="crest-stroke" />
    <!-- Antorcha Derecha -->
    <path d="M 68,42 L 68,52 M 65,42 L 71,42 M 68,40 Q 66,35 68,31 Q 70,35 68,40 Z" class="crest-stroke" />

    <!-- Guirnalda Botánica / Ramas Ornamentales del marco -->
    <path d="M 16,50 Q 12,65 18,84 Q 24,98 38,105" class="crest-stroke" stroke-width="1.2" />
    <path d="M 80,50 Q 84,65 78,84 Q 72,98 58,105" class="crest-stroke" stroke-width="1.2" />
    <path d="M 18,45 Q 22,25 36,18 Q 48,14 60,18 Q 74,25 78,45" class="crest-stroke" stroke-width="1.2" />

    <!-- Año de Fundación 1803 -->
    <text x="48" y="126" class="text-year" text-anchor="middle">1 8 0 3</text>
  </g>

  <!-- LOGOTIPO INSTITUCIONAL A DOS LÍNEAS -->
  <!-- Línea 1: UNIVERSIDAD -->
  <text x="122" y="58" class="text-title">UNIVERSIDAD</text>
  <!-- Línea 2: DE ANTIOQUIA -->
  <text x="122" y="90" class="text-title">DE ANTIOQUIA</text>

  <!-- SUBTÍTULO DE DEPENDENCIA (Centro de Investigaciones y Consultorías - CIC) -->
  <g transform="translate(122, 102)">
    <line x1="0" y1="4" x2="330" y2="4" stroke="#e0e8e3" stroke-width="1" />
    <text x="0" y="24" class="text-sub">Centro de Investigaciones y Consultorías — CIC</text>
  </g>
</svg>
